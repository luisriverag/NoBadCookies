<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Approved Cookie Suppliers</title>
  <link rel="stylesheet" href="../lib/style.css">
  <style>
    body { width: 500px; min-height: 400px; }
    .supplier-list { margin: 10px; }
    .supplier-item { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid #ddd; }
    .supplier-text { flex: 1; font-family: monospace; }
    .remove-btn { background: #e74c3c; color: white; border: none; padding: 2px 8px; cursor: pointer; border-radius: 3px; }
    .add-section { padding: 10px; border-top: 1px solid #ddd; }
    .add-section input { width: 70%; padding: 5px; }
    .add-section button { padding: 5px 10px; margin-left: 5px; }
    .menu-link { text-align: center; padding: 10px; border-top: 1px solid #ddd; }
    .menu-link a { color: #3498db; text-decoration: none; }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <h2>NoBadCookies - Approved Suppliers</h2>
    </div>
    <p style="padding: 10px; font-size: 12px; color: #666;">
      Cookies from these domains will NOT be auto-deleted when tabs close.
      Use *.domain.com to match subdomains.
    </p>
    <div id="supplierList" class="supplier-list"></div>
    <div class="add-section">
      <input type="text" id="newSupplier" placeholder="*.example.com">
      <button id="addSupplier">Add</button>
    </div>
    <div class="menu-link">
      <button id="resetDefault">Reset to Default</button>
    </div>
  </div>
  <script src="../lib/browserDetector.js"></script>
  <script src="approved-suppliers.js"></script>
</body>
</html>
